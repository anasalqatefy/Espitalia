<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اسبتاليا - رعاية طبية منزلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f2a23; --teal:#0d7a6c; --teal-dark:#083f37; --cream:#f5f8f1;
  --card:#ffffff; --accent:#7cb342; --line:#dfe8d6; --muted:#5d7269; --soft:#eaf3e6;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{ --cream:#0d1512; --card:#132420; --ink:#e9f2ec; --line:#213b33; --muted:#93aca2; --soft:#132920; }
*{box-sizing:border-box;}
html{scroll-behavior:smooth; scroll-padding-top:74px;}
html[lang="ar"] body{font-family:'Tajawal',system-ui,sans-serif;}
html[lang="en"] body{font-family:'Inter',system-ui,sans-serif;}
body{margin:0; background:var(--cream); color:var(--ink); line-height:1.6; overflow-x:hidden;}
.wrap{max-width:1100px; margin:0 auto; padding:0 20px;}
a{color:inherit; text-decoration:none;}
img,svg{max-width:100%; display:block;}
.icn{width:18px;height:18px;flex:0 0 auto;}
button{font-family:inherit;}
.ltr-num{unicode-bidi:isolate; direction:ltr; display:inline-block;}

.reveal{opacity:0; transform:translateY(16px); transition:opacity .6s ease, transform .6s ease;}
.reveal.in{opacity:1; transform:none;}
.page{display:none;}
.page.active{display:block;}
.links a.active, .mobile-menu a.active{color:var(--teal); font-weight:800;}
.links a.active::after{width:100%;}

.strip{background:var(--teal-dark); color:#fff; font-size:.85rem;}
.strip .wrap{display:flex; align-items:center; gap:12px; padding:8px 20px; flex-wrap:wrap;}
.strip .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent); flex:0 0 auto; animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:.35}}
.strip .sub{opacity:.75}
.strip a{margin-inline-start:auto; background:rgba(255,255,255,.14); padding:5px 12px; border-radius:999px; font-weight:700;}

header{position:sticky; top:0; z-index:30; background:rgba(245,248,241,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px); transition:transform .3s ease;}
header.hide{transform:translateY(-100%);}
nav.inner{display:flex; align-items:center; gap:18px; padding:10px 20px;}
.brand img{height:30px; width:auto;}
.links{display:flex; gap:20px; margin-inline-end:auto; font-weight:500;}
.links a{position:relative; padding:4px 0;}
.links a::after{content:"";position:absolute;bottom:-2px;inset-inline-start:0;width:0;height:2px;background:var(--accent);transition:width .2s ease;}
.links a:hover::after{width:100%;}
@media (max-width:760px){.links{display:none;}}
.call-btn{background:var(--teal); color:#fff; padding:9px 16px; border-radius:999px; font-weight:700; font-size:.9rem;}
.lang-btn{border:1.5px solid var(--line); background:transparent; color:var(--ink); padding:8px 14px; border-radius:999px; font-weight:700; font-size:.85rem; cursor:pointer; display:flex; align-items:center; gap:6px;}
.lang-btn:hover{border-color:var(--teal); color:var(--teal);}
.burger{display:none; background:none; border:none; padding:6px; cursor:pointer;}
@media (max-width:760px){.burger{display:block;}}
.mobile-menu{display:none; flex-direction:column; gap:2px; border-top:1px solid var(--line); background:var(--cream);}
.mobile-menu.open{display:flex;}
.mobile-menu a{padding:14px 20px; border-bottom:1px solid var(--line); font-weight:600;}

.hero{padding:56px 0 40px; background:linear-gradient(180deg,var(--soft),var(--cream) 70%);}
.hero .wrap{display:grid; grid-template-columns:1.1fr .9fr; gap:32px; align-items:center;}
@media (max-width:800px){.hero .wrap{grid-template-columns:1fr;}}
.eyebrow{color:var(--accent); font-weight:700; font-size:.9rem; margin-bottom:8px;}
h1{font-size:clamp(2rem,5vw,3rem); margin:0 0 14px; font-weight:900; color:var(--teal-dark);}
.hero p{color:var(--muted); font-size:1.05rem; max-width:46ch;}
.actions{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap;}
.btn{padding:13px 22px; border-radius:999px; font-weight:700; border:none; cursor:pointer; font-size:1rem; transition:transform .15s ease, box-shadow .15s ease;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--teal); color:#fff;}
.btn-primary:hover{background:var(--teal-dark);}
.btn-ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
.btn-ghost:hover{border-color:var(--teal); color:var(--teal);}
.hero-visual{background:linear-gradient(135deg,var(--teal),var(--teal-dark)); border-radius:28px; padding:28px; color:#fff; position:relative; overflow:hidden; perspective:900px;}
.hero-visual::after{content:""; position:absolute; inset-block-start:-40%; inset-inline-end:-40%; width:220px; height:220px; background:var(--accent); opacity:.3; border-radius:50%;}
.hero-3d{position:absolute; inset:0; z-index:0; opacity:.9;}
.hero-tilt{position:relative; z-index:1; transform-style:preserve-3d; transition:transform .25s ease;}
.mini-card{background:rgba(255,255,255,.14); border-radius:16px; padding:14px 16px; margin-bottom:12px; display:flex; gap:12px; align-items:center; position:relative; backdrop-filter:blur(2px);}
.mini-card b{display:block;} .mini-card small{opacity:.85;}
.pin{margin-top:16px; font-size:.9rem; opacity:.9; display:flex; gap:6px; align-items:center; position:relative;}

.stats{border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:26px 0; background:var(--soft);}
.stats .wrap{display:flex; flex-wrap:wrap; gap:28px; align-items:center; justify-content:space-between;}
.stat strong{display:block; font-size:1.7rem; color:var(--teal); font-weight:900;}
.stat span{color:var(--muted); font-size:.9rem;}
.stat-note{color:var(--muted); font-size:.9rem; display:flex; gap:8px; align-items:center;}

.section{padding:60px 0;}
.section h2{font-size:clamp(1.6rem,3.5vw,2.3rem); margin:0 0 8px; font-weight:900; color:var(--teal-dark);}
.section .lead{color:var(--muted); max-width:60ch; margin-bottom:34px;}

.svc-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
.svc-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, border-color .2s ease;}
.svc-card:hover{transform:translateY(-3px); box-shadow:0 14px 30px -18px rgba(13,122,108,.45); border-color:var(--teal);}
.svc-top{display:flex; align-items:center; justify-content:space-between;}
.svc-num{font-size:.75rem; color:var(--accent); font-weight:800;}
.svc-dot{width:34px; height:34px; border-radius:50%; margin:8px 0 12px; background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--teal) 55%, #fff), var(--teal) 70%); box-shadow:inset 0 -4px 6px rgba(0,0,0,.25), inset 0 3px 4px rgba(255,255,255,.5), 0 6px 10px -4px rgba(13,122,108,.5);}
.svc-card h3{font-size:1rem; margin:0; font-weight:700;}
.svc-chevron{transition:transform .2s ease; color:var(--muted);}
.svc-card.open .svc-chevron{transform:rotate(180deg);}
.svc-desc{max-height:0; overflow:hidden; transition:max-height .25s ease, margin-top .25s ease; font-size:.88rem; color:var(--muted); margin-top:0;}
.svc-card.open .svc-desc{max-height:120px; margin-top:10px;}

.how{background:var(--teal-dark); color:#fff;}
.how .lead{color:rgba(255,255,255,.75);}
.how h2{color:#fff;}
.steps{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
@media (max-width:760px){.steps{grid-template-columns:1fr;}}
.step{background:rgba(255,255,255,.07); border-radius:16px; padding:22px; transition:background .2s ease;}
.step:hover{background:rgba(255,255,255,.12);}
.step .num{color:#fff; font-weight:900; font-size:1.15rem; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--accent) 60%, #fff), var(--accent) 75%); box-shadow:inset 0 -4px 6px rgba(0,0,0,.25), inset 0 3px 4px rgba(255,255,255,.5), 0 6px 12px -4px rgba(0,0,0,.4);}
.step h3{margin:10px 0 6px;}
.step p{color:rgba(255,255,255,.75); margin:0; font-size:.95rem;}

.trust .wrap{display:grid; grid-template-columns:.8fr 1.2fr; gap:36px; align-items:center;}
.trust-illust{width:100%; max-width:260px; margin-bottom:16px; display:block;}
@media (max-width:800px){.trust .wrap{grid-template-columns:1fr;}}
.quote-box{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:26px;}
.quote-box p{font-size:1.15rem; font-weight:700; margin:10px 0;}
.quote-box small{color:var(--muted);}
.trust ul{list-style:none; padding:0; margin:18px 0;}
.trust li{display:flex; gap:10px; margin-bottom:10px; color:var(--ink); align-items:center;}
.trust li .icn{color:var(--teal);}

.gallery{background:var(--soft);}
.book-wrap{position:relative;}
.book-scroll{display:flex; gap:22px; overflow-x:auto; scroll-snap-type:x mandatory; padding:14px 4px 22px; -webkit-overflow-scrolling:touch; scrollbar-width:thin;}
.book-scroll::-webkit-scrollbar{height:8px;}
.book-scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
.book-page{flex:0 0 auto; width:250px; scroll-snap-align:center; background:var(--card); border-radius:14px; overflow:hidden; border:1px solid var(--line); transform:rotate(var(--rot,0deg)); transition:transform .2s ease;}
.book-page:nth-child(odd){--rot:-1.4deg;}
.book-page:nth-child(even){--rot:1.4deg;}
.book-page:hover{transform:rotate(0deg) translateY(-6px);}
.book-page img{width:100%; display:block;}
.book-nav{display:flex; justify-content:center; gap:12px; margin-top:6px;}
.book-nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line); background:var(--card); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--teal); transition:border-color .2s ease;}
.book-nav button:hover{border-color:var(--teal);}

.contact-grid{display:grid; grid-template-columns:1fr 1fr; gap:34px;}
@media (max-width:800px){.contact-grid{grid-template-columns:1fr;}}
.opt{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; transition:border-color .2s ease, transform .15s ease;}
.opt:hover{border-color:var(--teal); transform:translateY(-2px);}
.opt small{display:block; color:var(--muted); font-size:.8rem;}
.opt strong{font-size:1rem;}
.pay-badges{display:flex; gap:6px; margin-top:5px; flex-wrap:wrap;}
.pay-badge{font-size:.68rem; font-weight:700; color:var(--teal-dark); background:var(--soft); border:1px solid var(--line); padding:2px 8px; border-radius:999px;}
.opt-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center; color:#fff; background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--teal) 55%, #fff), var(--teal) 75%); box-shadow:inset 0 -3px 5px rgba(0,0,0,.25), inset 0 2px 3px rgba(255,255,255,.5), 0 5px 10px -4px rgba(13,122,108,.5);}
.form-card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:26px;}
.form-card label{display:block; font-size:.85rem; font-weight:700; margin-bottom:14px;}
.form-card input, .form-card select, .form-card textarea{width:100%; margin-top:6px; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--cream); color:var(--ink); font-family:inherit; font-size:.95rem; transition:border-color .2s ease;}
.form-card input:focus, .form-card select:focus, .form-card textarea:focus{outline:none; border-color:var(--teal);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:500px){.row2{grid-template-columns:1fr;}}
.form-note{font-size:.8rem; color:var(--muted); display:flex; gap:6px; align-items:center; margin-top:10px;}
#formMsg{display:none; background:color-mix(in srgb, var(--teal) 14%, transparent); color:var(--teal-dark); padding:10px 14px; border-radius:10px; font-weight:700; margin-bottom:14px; font-size:.9rem;}

footer{border-top:1px solid var(--line); padding:30px 0; color:var(--muted); font-size:.85rem;}
footer .wrap{display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px; align-items:center;}
footer img{height:24px;}

.fab-group{position:fixed; inset-inline-end:18px; bottom:18px; display:flex; flex-direction:column; gap:10px; z-index:40;}
.fab{width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; color:#fff; transition:transform .15s ease, opacity .2s ease;}
.fab:active{transform:scale(.92);}
.fab-wa{background:#25925a;}
.fab-top{background:var(--teal-dark); opacity:0; pointer-events:none;}
.fab-top.show{opacity:1; pointer-events:auto;}
</style>
</head>

let lang = 'ar';

function renderServices(){
  const grid = document.getElementById('svcGrid');
  const svcSelect = document.getElementById('svcSelect');
  grid.innerHTML = services.map((s,i)=>{
    const d = s[lang];
    return `<article class="svc-card" data-i="${i}">
      <div class="svc-top">
        <div><div class="svc-num ltr-num">${d[0]}</div><div class="svc-dot"></div></div>
        <svg class="icn svc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <h3>${d[1]}</h3>
      <p class="svc-desc">${d[2]}</p>
    </article>`;
  }).join('');
  const placeholderText = dict.form_service_ph[lang];
  svcSelect.innerHTML = `<option value="" disabled selected>${placeholderText}</option>` +
    services.map(s=>`<option>${s[lang][1]}</option>`).join('');
}

function applyLang(){
  document.getElementById('htmlRoot').lang = lang;
  document.getElementById('htmlRoot').dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('langLabel').textContent = lang === 'ar' ? 'EN' : 'AR';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(dict[key]) el.textContent = dict[key][lang];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const key = el.getAttribute('data-i18n-placeholder');
    if(dict[key]) el.placeholder = dict[key][lang];
  });
  renderServices();
}

document.getElementById('langBtn').addEventListener('click', ()=>{
  lang = lang === 'ar' ? 'en' : 'ar';
  applyLang();
});

applyLang();

document.getElementById('svcGrid').addEventListener('click', e=>{
  const card = e.target.closest('.svc-card');
  if(!card) return;
  card.classList.toggle('open');
});

document.getElementById('reqForm').addEventListener('submit', function(e){
  e.preventDefault();
  const fd = new FormData(this);
  const name = (fd.get('name')||'').toString().trim();
  const phone = (fd.get('phone')||'').toString().trim();
  const service = (fd.get('service')||'').toString().trim();
  const notes = (fd.get('message')||'').toString().trim();
  const label = lang === 'ar'
    ? `طلب رعاية جديد من اسبتاليا\nالاسم: ${name}\nرقم الهاتف: ${phone}\nالخدمة: ${service}` + (notes ? `\nملاحظات: ${notes}` : '')
    : `New care request from Espitalia\nName: ${name}\nPhone: ${phone}\nService: ${service}` + (notes ? `\nNotes: ${notes}` : '');
  document.getElementById('formMsg').style.display = 'block';
  window.open('https://wa.me/201042449039?text=' + encodeURIComponent(label), '_blank');
  this.reset();
});

const bookScroll = document.getElementById('bookScroll');
function bookStep(){ const page = bookScroll.querySelector('.book-page'); return page ? page.getBoundingClientRect().width + 22 : 270; }
function bookDir(){ return document.getElementById('htmlRoot').dir === 'rtl' ? -1 : 1; }
document.getElementById('bookNext').addEventListener('click', ()=> bookScroll.scrollBy({left: bookStep()*bookDir(), behavior:'smooth'}));
document.getElementById('bookPrev').addEventListener('click', ()=> bookScroll.scrollBy({left: -bookStep()*bookDir(), behavior:'smooth'}));

const validPages = ['home','services','how','gallery','contact'];
function showPage(id){
  if(!validPages.includes(id)) id = 'home';
  document.querySelectorAll('.page').forEach(p=> p.classList.remove('active'));
  const target = document.getElementById('page-'+id);
  if(target) target.classList.add('active');
  document.querySelectorAll('.links a, .mobile-menu a').forEach(a=>{
    a.classList.toggle('active', a.getAttribute('href') === '#'+id);
  });
  window.scrollTo(0,0);
  lastY = 0;
  header.classList.remove('hide');
  mobileMenu.classList.remove('open');
}
window.addEventListener('hashchange', ()=> showPage(location.hash.replace('#','') || 'home'));

const burger = document.getElementById('burgerBtn');
const mobileMenu = document.getElementById('mobileMenu');
burger.addEventListener('click', ()=> mobileMenu.classList.toggle('open'));
mobileMenu.addEventListener('click', e=>{ if(e.target.tagName==='A') mobileMenu.classList.remove('open'); });

const header = document.getElementById('siteHeader');
let lastY = window.scrollY;
window.addEventListener('scroll', ()=>{
  const y = window.scrollY;
  if(y > lastY && y > 120){ header.classList.add('hide'); mobileMenu.classList.remove('open'); }
  else { header.classList.remove('hide'); }
  lastY = y;
  document.getElementById('toTop').classList.toggle('show', y > 500);
}, {passive:true});

document.getElementById('toTop').addEventListener('click', ()=> window.scrollTo({top:0, behavior:'smooth'}));

try{
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, {threshold:.15});
  document.querySelectorAll('.reveal').forEach(el=> io.observe(el));
}catch(e){ document.querySelectorAll('.reveal').forEach(el=> el.classList.add('in')); }

try{
  const counters = document.querySelectorAll('[data-count]');
  const cio = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const el = en.target;
      const target = +el.dataset.count;
      const suffix = el.dataset.suffix || '';
      let cur = 0;
      const step = Math.max(1, Math.round(target/30));
      const t = setInterval(()=>{
        cur += step;
        if(cur >= target){ cur = target; clearInterval(t); }
        el.textContent = cur + suffix;
      }, 30);
      cio.unobserve(el);
    });
  }, {threshold:.6});
  counters.forEach(el=> cio.observe(el));
}catch(e){}
try{
  const canvas = document.getElementById('heroCanvas');
  const holder = document.getElementById('heroVisual');
  if(canvas && window.THREE){
    const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0, 6);
    const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(3,4,5); scene.add(key);
    scene.add(new THREE.AmbientLight(0xbfe9df, .6));
    const accent = new THREE.Color(0x7cb342);
    const teal = new THREE.Color(0xeafff8);
    const core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.35, 1),
      new THREE.MeshStandardMaterial({color: teal, metalness:.25, roughness:.3, flatShading:true, transparent:true, opacity:.92})
    );
    scene.add(core);
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(2.05, 0.09, 12, 60),
      new THREE.MeshStandardMaterial({color: accent, metalness:.4, roughness:.35})
    );
    ring.rotation.x = Math.PI/2.6;
    scene.add(ring);
    const ring2 = ring.clone();
    ring2.rotation.x = -Math.PI/2.2; ring2.rotation.y = Math.PI/4;
    ring2.material = ring.material.clone(); ring2.material.opacity = .55; ring2.material.transparent = true;
    scene.add(ring2);

    function fit(){
      const w = holder.clientWidth, h = holder.clientHeight;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
      renderer.setSize(w, h, false);
      camera.aspect = w/h; camera.updateProjectionMatrix();
    }
    fit();
    window.addEventListener('resize', fit);

    let raf;
    function animate(t){
      core.rotation.y = t*0.00035;
      core.rotation.x = Math.sin(t*0.0004)*0.25;
      ring.rotation.z = t*0.0002;
      ring2.rotation.z = -t*0.00025;
      const s = 1 + Math.sin(t*0.0018)*0.03;
      core.scale.set(s,s,s);
      renderer.render(scene, camera);
      raf = requestAnimationFrame(animate);
    }
    raf = requestAnimationFrame(animate);

    const io3d = new IntersectionObserver(es=>{
      es.forEach(e=>{ if(!e.isIntersecting && raf){ cancelAnimationFrame(raf); raf=null; } else if(e.isIntersecting && !raf){ raf = requestAnimationFrame(animate); } });
    }, {threshold:.05});
    io3d.observe(holder);
  }
}catch(e){}

try{
  const tilt = document.getElementById('heroTilt');
  const holder2 = document.getElementById('heroVisual');
  if(tilt && holder2 && matchMedia('(pointer:fine)').matches){
    holder2.addEventListener('mousemove', ev=>{
      const r = holder2.getBoundingClientRect();
      const px = (ev.clientX - r.left)/r.width - .5;
      const py = (ev.clientY - r.top)/r.height - .5;
      tilt.style.transform = `rotateY(${px*10}deg) rotateX(${-py*10}deg)`;
    });
    holder2.addEventListener('mouseleave', ()=>{ tilt.style.transform = 'rotateY(0) rotateX(0)'; });
  }
}catch(e){}

showPage(location.hash.replace('#','') || 'home');
</script>
